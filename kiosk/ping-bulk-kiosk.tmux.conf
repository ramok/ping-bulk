# ping-bulk kiosk tmux configuration
# This file is used when ping-bulk starts tmux in --kiosk mode.
# It hardens the tmux session so users cannot escape to an arbitrary shell.

# ── Security ────────────────────────────────────────────────────────────────

# Any new window/pane created by the user requires login authentication.
set-option -g default-command "login"

# Disable the status bar (it shows tmux version and hostname, unnecessary clutter)
set-option -g status off

# ── Remove all default key bindings ─────────────────────────────────────────
# Users must not be able to spawn unrestricted shells via tmux hotkeys.
unbind-key -a

# Keep only the prefix key so tmux doesn't appear completely frozen when the
# prefix sequence is pressed accidentally; any subsequent key is silently
# ignored because no bindings remain.
set-option -g prefix None

# ── Session locking by inactivity timeout ───────────────────────────────────
# When enabled, tmux locks the session after N seconds of no keyboard input.
# The user must enter their Unix password to unlock (via lock-command).
# Uncomment and adjust to suit your site's idle policy:
#
#set-option -g lock-after-time 600
#set-option -g lock-command "vlock -c"

# ── Prevent accidental exit from the ping-bulk window ───────────────────────
# When the ping-bulk process exits (e.g., during --kiosk auto-reload), tmux
# should keep the window alive and wait — systemd will restart the service.
set-option -g remain-on-exit on
set-hook -g pane-died "respawn-pane -k"
