[pytest]
# Automatically retry once when a test fails with TimeoutError.
# This guards against transient load spikes that delay tmux rendering
# beyond the poll window without hiding real bugs (only TimeoutError retries).
#
# For persistently slow hosts, multiply *all* timeouts instead:
#   PING_BULK_TIMEOUT_SCALE=3 pytest -n auto tests/
reruns = 1
reruns_delay = 0.5
only_rerun = TimeoutError
