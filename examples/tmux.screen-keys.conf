# examples/tmux.screen-keys.conf — tmux with GNU screen-compatible key bindings
#
# Usage:
#   tmux -f examples/tmux.screen-keys.conf        start a new server with this config
#   tmux source-file examples/tmux.screen-keys.conf  reload inside a running session
#
# To use permanently, source it from your ~/.tmux.conf:
#   source-file /path/to/ping-bulk/examples/tmux.screen-keys.conf

# ── General settings ──────────────────────────────────────────────────────────
set-option -g default-terminal "screen-256color"  # same $TERM as GNU screen
set-option -g history-limit 15000
set-option -g base-index 1                        # number windows from 1, like screen
set-option -g bell-action none
set-option -g status-keys vi
set-window-option -g mode-keys vi

# ── Prefix key ────────────────────────────────────────────────────────────────
# screen: C-a   tmux default: C-b
unbind-key C-b
set-option -g prefix C-a

bind-key a   send-prefix           # C-a a   → send literal C-a to the shell
bind-key C-a last-window           # C-a C-a → toggle to previously active window

# ── Window management ─────────────────────────────────────────────────────────
# screen: C-a c / C-a C-c — new window
unbind-key C-c
bind-key C-c new-window
bind-key c   new-window -c "#{pane_current_path}"   # new window, keep current path

# screen: C-a n / C-a Space / C-a C-n — next window
unbind-key C-n
bind-key C-n  next-window
bind-key n    next-window
bind-key Space next-window

# screen: C-a p / C-a C-p / C-a Backspace — previous window
unbind-key C-p
bind-key C-p   previous-window
bind-key p     previous-window
bind-key BSpace previous-window

# screen: C-a C-a — toggle to last active window (already bound above)

# screen: C-a A — rename window
unbind-key A
bind-key A   command-prompt "rename-window '%%'"

# screen: C-a w / C-a C-w — window list (brief)
unbind-key C-w
bind-key C-w list-windows
bind-key w   list-windows

# screen: C-a " — interactive window chooser
unbind-key '"'
bind-key '"' choose-window

# screen: C-a ' — go to window by name or number
bind-key "'" command-prompt -p "window:" "select-window -t '%%'"

# screen: C-a 0–9 — switch to window by number
bind-key 0   select-window -t :0
bind-key 1   select-window -t :1
bind-key 2   select-window -t :2
bind-key 3   select-window -t :3
bind-key 4   select-window -t :4
bind-key 5   select-window -t :5
bind-key 6   select-window -t :6
bind-key 7   select-window -t :7
bind-key 8   select-window -t :8
bind-key 9   select-window -t :9

# screen: C-a k / C-a C-k — kill current window / session
unbind-key K
bind-key K   confirm-before -p "kill window? (y/n)" kill-window
unbind-key C-k
bind-key C-k confirm-before -p "kill session? (y/n)" kill-session

# screen: C-a * — list clients attached to this session
unbind-key *
bind-key *   list-clients

# ── Session ───────────────────────────────────────────────────────────────────
# screen: C-a d / C-a C-d — detach
unbind-key C-d
bind-key C-d detach-client
bind-key d   detach-client

# ── Split / Region management ─────────────────────────────────────────────────
# screen: C-a S — horizontal split (new pane below)
# screen: C-a | — vertical split   (new pane to the right)
bind-key S   split-window -v -c "#{pane_current_path}"
bind-key |   split-window -h -c "#{pane_current_path}"

# screen: C-a Tab — focus next region
unbind-key Tab
bind-key Tab  select-pane -t :.+
bind-key BTab select-pane -t :.-    # shift-tab — focus previous region

# screen: C-a X — remove (kill) current region
# screen: C-a Q — keep only current region (kill all others)
bind-key X   kill-pane
bind-key Q   kill-pane -a

# No direct screen equivalent, but very useful:
bind-key O   break-pane            # move current pane to its own window

# ── Scrollback / Copy mode ────────────────────────────────────────────────────
# screen: C-a [ / C-a Esc — enter copy/scrollback mode
# screen: C-a ]           — paste
bind-key [      copy-mode
bind-key Escape copy-mode
bind-key ]      paste-buffer

# vi-style selection and copy inside copy mode
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ── Display / Misc ────────────────────────────────────────────────────────────
# screen: C-a l / C-a C-l — redisplay / refresh
unbind-key C-l
bind-key C-l refresh-client
bind-key l   refresh-client

# screen: C-a t — time / clock
bind-key t   clock-mode

# screen: C-a i — window info
bind-key i   display-message

# screen: C-a : — command mode
bind-key :   command-prompt

# screen: C-a ? — list key bindings (help)
bind-key ?   list-keys

# screen: C-a z — suspend; tmux equivalent: zoom / toggle full-screen pane
bind-key z   resize-pane -Z

# screen: C-a H — toggle logging to file (screenlog.N equivalent)
unbind-key H
bind-key H   pipe-pane -o \
             'tee -a ~/tmux.#S-#I.#P.log > /dev/null' \; \
             display-message 'Toggled logging to ~/tmux.#S-#I.#P.log'

# ── Extra bindings (no direct screen equivalent, but useful) ──────────────────
bind-key =   setw synchronize-panes   # broadcast input to all panes in window

# ── Status bar ────────────────────────────────────────────────────────────────
# screen has no status bar; this gives a minimal, readable equivalent.
set-option -g status on
set-option -g status-style                "bg=blue,fg=white"
set-option -g window-status-style         "bg=blue,fg=white"
set-option -g window-status-current-style "bg=white,fg=blue,bold"
set-option -g status-left                 "[#S] "
set-option -g status-right                "%H:%M %d-%b "

# ── Mouse support ─────────────────────────────────────────────────────────────
# Uncomment to enable mouse (pane select, resize, scrollback):
# set-option -g mouse on
